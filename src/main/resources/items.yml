  # Sacrificial Scrolls: Consume hearts for temporary buffs
  scrolls:
    warrior-scroll:
      material: "PAPER"
      display-name: "&6&lSacrificial Warrior Scroll"
      custom-model-data: 2001
      heart-cost: 2
      cooldown-seconds: 60
      effects:
        - "INCREASE_DAMAGE:1:60"   # Strength II for 60 seconds
        - "SPEED:0:120"             # Speed I for 120 seconds
      lore:
        - "&7Sacrifice your life force for battle."
        - "&cCost: &f-2 Hearts"
        - ""
        - "&7Grants:"
        - "&8- &eStrength II &8(1 min)"
        - "&8- &eSpeed I &8(2 mins)"
        - ""
        - "&eRight-click to sacrifice!"

    healing-scroll:
      material: "PAPER"
      display-name: "&a&lSacrificial Recovery Scroll"
      custom-model-data: 2002
      heart-cost: 1
      cooldown-seconds: 30
      effects:
        - "REGENERATION:2:15"       # Regeneration III for 15 seconds
        - "HEAL:1:0"                # Instant Health II
      lore:
        - "&7Sacrifice structure to bind flesh."
        - "&cCost: &f-1 Heart"
        - ""
        - "&7Grants:"
        - "&8- &eRegeneration III &8(15s)"
        - "&8- &eInstant Health II"
        - ""
        - "&eRight-click to sacrifice!"

