    # Heart status
    current-hearts: "&7Du hast derzeit &#ff3333%hearts% &7Herzen (Max: &f%max_hearts%&7)."
    check-hearts: "&e%player% &7hat &#ff3333%hearts% &7Herzen (Max: &f%max_hearts%&7)."
