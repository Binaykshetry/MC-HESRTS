    set-hearts: "&aSe establecieron los corazones de %player% en &f%amount%&a."
    set-max-hearts: "&aSe anuló el límite máximo de corazones de %player% a &f%amount%&a."
    
    # Kills & Deaths
    kill-broadcast: "&#ff3333&lAsesinato &r&8» &#ff5555%killer% &7asesinó a &#ff5555%victim% &7y ganó &#ff5555+%amount% &7corazón(es)!"
    death-natural: "&#ff3333&lPérdida &r&8» &#ff5555%victim% &7murió por causas naturales y perdió &#ff5555-%amount% &7corazón."

  de:
    prefix: "&#ff3333&lHeartss &r&8» "
