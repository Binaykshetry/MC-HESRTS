    player-not-found: "&cSpieler %player% wurde nicht gefunden oder ist offline."
    invalid-amount: "&cBitte gib eine gültige positive Ganzzahl ein."
    success-reload: "&aKonfiguration, Items, Rezepte und Menüs erfolgreich neu geladen!"
